<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self Storage India – Delhi Location Map</title>
  <!-- Google Fonts: Plus Jakarta Sans, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    :root {
      --primary: #2864df;
      --primary-hover: #1e4ebf;
      --accent: #ef8a22;
      --accent-hover: #d97718;
      --text: #222222;
      --text-secondary: #555555;
      --border: #e5e5e5;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: #ffffff;
      color: var(--text);
    }

    /* =========================
       HEADER
    ========================== */
    .site-header {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 100;
    }

    .header-container {
      max-width: 1510px;
      margin: 0 auto;
      min-height: 80px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo img {
      width: 220px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .main-navigation {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .main-navigation a {
      color: var(--primary);
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.25s ease;
      white-space: nowrap;
    }

    .main-navigation a:hover,
    .main-navigation a.active {
      color: var(--accent);
    }

    .header-phone {
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .calculator-button {
      min-width: 180px;
      padding: 11px 20px;
      border-radius: 5px;
      background: var(--accent);
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      text-align: center;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .calculator-button:hover {
      background: var(--accent-hover) !important;
      transform: translateY(-2px);
    }

    .menu-toggle {
      display: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 5px;
    }

    .menu-toggle span {
      width: 24px;
      height: 2.5px;
      background: var(--primary);
      display: block;
      margin: 4px 0;
      border-radius: 4px;
    }

    /* =========================
       LOCATION MAP (COMPACT)
    ========================== */
    .location-section {
      width: 100%;
      overflow: hidden;
      background: #f6f6f6;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      min-height: 520px;
      background-image: url("assets/dwarka_storage.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Warehouse marker */
    .warehouse-location {
      position: absolute;
      left: 36%;
      top: 22%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
    }

    .warehouse-pin {
      position: relative;
      width: 72px;
      height: 90px;
      margin: 0 auto;
    }

    .pin-circle {
      width: 64px;
      height: 64px;
      border-radius: 50% 50% 50% 0;
      background: #ff9800;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .pin-inner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
    }

    .lock-icon {
      font-size: 24px;
      color: #ff9800;
      line-height: 1;
    }

    .warehouse-title {
      position: absolute;
      right: 80px;
      top: 15px;
      width: 180px;
      color: #d93e28;
      font-family: var(--font-heading);
      font-size: 17px;
      line-height: 1.15;
      font-weight: 700;
      text-align: right;
    }

    /* Connection lines */
    .connection-line {
      position: absolute;
      height: 2px;
      background: #555555;
      transform-origin: left center;
      z-index: 2;
      opacity: 0.7;
    }

    .line-airport {
      left: 36%;
      top: 32%;
      width: 105px;
      transform: rotate(72deg);
    }

    .line-redfort {
      left: 36%;
      top: 29%;
      width: 250px;
      transform: rotate(-18deg);
    }

    .line-india-gate {
      left: 36%;
      top: 30%;
      width: 230px;
      transform: rotate(10deg);
    }

    .line-lotus {
      left: 36%;
      top: 30%;
      width: 285px;
      transform: rotate(26deg);
    }

    .line-qutub {
      left: 36%;
      top: 31%;
      width: 250px;
      transform: rotate(45deg);
    }

    .line-kingdom {
      left: 36%;
      top: 31%;
      width: 200px;
      transform: rotate(91deg);
    }

    /* Location cards - Compact style matching reference */
    .location-card {
      position: absolute;
      z-index: 4;
      width: 170px;
      height: 48px;
      border-radius: 24px 6px 6px 24px;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      padding-left: 54px;
      padding-right: 10px;
    }

    /* Airplane card needs circle on the right side */
    .airport-card {
      left: 36%;
      top: 48%;
      transform: translateX(-50%);
      border-radius: 6px 24px 24px 6px;
      padding-left: 12px;
      padding-right: 54px;
    }

    .location-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }

    .location-icon {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 18px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .airport-card .location-icon {
      left: auto;
      right: 0;
      background: #1e70e9;
    }

    .redfort-card {
      left: 61%;
      top: 18%;
    }

    .redfort-card .location-icon {
      background: #ef3626;
    }

    .india-card {
      left: 60%;
      top: 36%;
    }

    .india-card .location-icon {
      background: #183cc8;
    }

    .lotus-card {
      left: 65%;
      top: 50%;
    }

    .lotus-card .location-icon {
      background: #4caf50;
    }

    .qutub-card {
      left: 56%;
      top: 61%;
    }

    .qutub-card .location-icon {
      background: #b71c1c;
    }

    .kingdom-card {
      left: 47%;
      top: 78%;
    }

    .kingdom-card .location-icon {
      background: #e040fb;
    }

    .location-name {
      font-family: var(--font-heading);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      text-transform: uppercase;
      color: #222222;
    }

    .location-time {
      margin-top: 1px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 500;
      color: #555555;
    }

    /* =========================
       RESPONSIVE DESIGN
    ========================== */
    @media (max-width: 1250px) {
      .header-container {
        min-height: 70px;
      }

      .logo img {
        width: 190px;
      }

      .main-navigation {
        gap: 20px;
      }

      .main-navigation a {
        font-size: 15px;
      }

      .calculator-button {
        min-width: 150px;
        padding: 10px 15px;
      }
    }

    @media (max-width: 991px) {
      .header-container {
        min-height: 65px;
        padding: 10px 16px;
      }

      .logo img {
        width: 180px;
      }

      .menu-toggle {
        display: block;
      }

      .main-navigation {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        padding: 15px;
        background: #ffffff;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        display: none;
      }

      .main-navigation.open {
        display: flex;
      }

      .calculator-button {
        width: 100%;
      }

      .map-wrapper {
        min-height: auto;
        background-image: none;
        padding: 30px 16px;
      }

      .map-wrapper::before,
      .connection-line {
        display: none;
      }

      .warehouse-location {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        margin-bottom: 24px;
      }

      .warehouse-title {
        position: static;
        width: auto;
        margin-top: 10px;
        font-size: 18px;
        text-align: center;
      }

      .location-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        max-width: 760px;
        margin: 0 auto;
      }

      .location-card {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        min-width: auto;
        transform: none;
      }
    }

    @media (max-width: 600px) {
      .location-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="logo" aria-label="Self Storage India Home">
        <img src="assets/self-storage-india-logo.png" alt="Self Storage India – Creating Extra Space" />
      </a>

      <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-navigation">
        <a href="/">Storage</a>
        <a href="#locations" class="active">Locations</a>
        <a href="/#offerings">Offerings</a>
        <a href="/#blogs">Blogs</a>
        <a href="tel:+919090206090" class="header-phone">
          <i class="fa-solid fa-phone" style="font-size: 13px; margin-right: 4px;"></i>+91-9090206090
        </a>
        <a href="/#calculator" class="calculator-button">
          Storage Calculator
        </a>
      </nav>
    </div>
  </header>

  <!-- Map Section -->
  <section class="location-section" id="locations">
    <div class="map-wrapper">

      <!-- Warehouse marker -->
      <div class="warehouse-location">
        <div class="warehouse-pin">
          <div class="pin-circle">
            <div class="pin-inner">
              <span class="lock-icon">
                <i class="fa-solid fa-lock"></i>
              </span>
            </div>
          </div>
        </div>
        <div class="warehouse-title">
          Self Storage India<br />Warehouse
        </div>
      </div>

      <!-- Connecting lines -->
      <span class="connection-line line-airport"></span>
      <span class="connection-line line-redfort"></span>
      <span class="connection-line line-india-gate"></span>
      <span class="connection-line line-lotus"></span>
      <span class="connection-line line-qutub"></span>
      <span class="connection-line line-kingdom"></span>

      <div class="location-list">
        <!-- Airport -->
        <div class="location-card airport-card">
          <div class="location-text">
            <div class="location-name">IGI Airport</div>
            <div class="location-time">05 Minutes</div>
          </div>
          <div class="location-icon">
            <i class="fa-solid fa-plane"></i>
          </div>
        </div>

        <!-- Red Fort -->
        <div class="location-card redfort-card">
          <div class="location-icon">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <div class="location-text">
            <div class="location-name">Red Fort</div>
            <div class="location-time">55 Minutes</div>
          </div>
        </div>

        <!-- India Gate -->
        <div class="location-card india-card">
          <div class="location-icon">
            <i class="fa-solid fa-archway"></i>
          </div>
          <div class="location-text">
            <div class="location-name">India Gate</div>
            <div class="location-time">40 Minutes</div>
          </div>
        </div>

        <!-- Lotus Temple -->
        <div class="location-card lotus-card">
          <div class="location-icon">
            <i class="fa-solid fa-spa"></i>
          </div>
          <div class="location-text">
            <div class="location-name">Lotus Temple</div>
            <div class="location-time">45 Minutes</div>
          </div>
        </div>

        <!-- Qutub Minar -->
        <div class="location-card qutub-card">
          <div class="location-icon">
            <i class="fa-solid fa-tower-observation"></i>
          </div>
          <div class="location-text">
            <div class="location-name">Qutub Minar</div>
            <div class="location-time">30 Minutes</div>
          </div>
        </div>

        <!-- Kingdom of Dreams -->
        <div class="location-card kingdom-card">
          <div class="location-icon">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div class="location-text">
            <div class="location-name">Kingdom of Dreams</div>
            <div class="location-time">20 Minutes</div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navigation = document.querySelector(".main-navigation");

    menuToggle.addEventListener("click", function () {
      const isOpen = navigation.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", isOpen);
    });
  </script>
</body>
</html>
